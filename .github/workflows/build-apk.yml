name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck
      
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Build web assets
      run: npm run build
        
    - name: Add Android platform
      run: |
        npx cap add android && npx cap sync android
        
    - name: Grant execute permission for gradlew
      run: chmod +x ./android/gradlew
      
    - name: Build Debug APK
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: Generate SHA-256 checksum
      run: sha256sum ./android/app/build/outputs/apk/debug/app-debug.apk > ./android/app/build/outputs/apk/debug/app-debug.apk.sha256

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: hyperion-debug-apk
        path: |
          ./android/app/build/outputs/apk/debug/app-debug.apk
          ./android/app/build/outputs/apk/debug/app-debug.apk.sha256
        retention-days: 30
        
    - name: Upload Release APK (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: hyperion-release-apk
        path: ./android/app/build/outputs/apk/release/app-release.apk
        retention-days: 90
